<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Log</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --bg4: #222222;
    --border: #2a2a2a;
    --border2: #333333;
    --text: #f0f0f0;
    --text2: #888888;
    --text3: #555555;
    --green: #39ff14;
    --green-dim: rgba(57,255,20,0.12);
    --green-mid: rgba(57,255,20,0.25);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --blue: #3b82f6;
    --blue-dim: rgba(59,130,246,0.12);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.12);
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }

  /* NAV */
  .nav { position: sticky; top: 0; z-index: 100; background: rgba(10,10,10,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; height: 52px; gap: 4px; }
  .nav-brand { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.05em; color: var(--green); margin-right: auto; text-transform: uppercase; }
  .nav-btn { padding: 6px 12px; border-radius: var(--radius); border: none; background: transparent; color: var(--text2); font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .nav-btn:hover { background: var(--bg3); color: var(--text); }
  .nav-btn.active { background: var(--bg3); color: var(--text); border: 1px solid var(--border2); }

  /* LAYOUT */
  .page { display: none; padding: 20px 16px; max-width: 900px; margin: 0 auto; }
  .page.active { display: block; }

  /* CARDS */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text); }

  /* GRID */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media(max-width:480px) { .grid2 { grid-template-columns: 1fr; } .grid3 { grid-template-columns: 1fr 1fr; } }

  /* STAT CARDS */
  .stat { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .stat-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
  .stat-value { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; color: var(--text); line-height: 1; }
  .stat-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .stat.green { border-color: var(--green); background: var(--green-dim); }
  .stat.green .stat-value { color: var(--green); }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .btn:hover { background: var(--bg4); border-color: var(--text3); }
  .btn-primary { background: var(--green); color: #000; border-color: var(--green); font-weight: 700; }
  .btn-primary:hover { background: #2edb0e; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red-dim); }

  /* WEEK VIEW */
  .week-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
  @media(max-width:600px) { .week-strip { grid-template-columns: repeat(5, 1fr); gap: 4px; } }
  .day-pill { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 6px; text-align: center; cursor: pointer; transition: all .15s; }
  .day-pill:hover { border-color: var(--border2); }
  .day-pill.done { border-color: var(--green); background: var(--green-dim); }
  .day-pill.today { border-color: var(--amber); }
  .day-pill.skipped { border-color: var(--red); background: var(--red-dim); opacity: .6; }
  .day-pill-name { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); }
  .day-pill.done .day-pill-name { color: var(--green); }
  .day-pill.today .day-pill-name { color: var(--amber); }
  .day-pill-type { font-size: 10px; color: var(--text3); margin-top: 2px; line-height: 1.2; }
  .day-pill-status { font-size: 16px; margin-top: 4px; }

  /* SESSION LOG */
  .session-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .session-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  .session-date { font-size: 12px; color: var(--text2); }
  .phase-tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; background: var(--blue-dim); color: var(--blue); border: 1px solid var(--blue); }

  /* EXO CARD */
  .exo-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; }
  .exo-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .exo-name { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .exo-target { font-size: 11px; color: var(--text3); }
  .pr-badge { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; background: var(--green); color: #000; animation: pulse-pr 1.5s ease-in-out infinite; }
  @keyframes pulse-pr { 0%,100% { opacity:1; } 50% { opacity:.6; } }

  /* SETS TABLE */
  .sets-table { width: 100%; border-collapse: collapse; }
  .sets-table th { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); padding: 4px 6px; text-align: left; }
  .sets-table td { padding: 4px 4px; }
  .set-input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 500; padding: 6px 8px; text-align: center; transition: border-color .15s; }
  .set-input:focus { outline: none; border-color: var(--green); }
  .set-planned { font-size: 12px; color: var(--text3); text-align: center; padding: 6px 4px; }
  .set-status { text-align: center; font-size: 14px; }
  .add-set-btn { margin-top: 8px; width: 100%; background: transparent; border: 1px dashed var(--border2); border-radius: 6px; color: var(--text3); font-size: 12px; padding: 6px; cursor: pointer; transition: all .15s; }
  .add-set-btn:hover { border-color: var(--text3); color: var(--text2); }

  /* ANKLE */
  .ankle-rating { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ankle-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .ankle-btn:hover { border-color: var(--text2); }
  .ankle-btn.selected { border-color: var(--green); background: var(--green-dim); color: var(--green); }
  .ankle-label { font-size: 11px; color: var(--text3); }

  /* NOTES */
  .notes-area { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px; padding: 10px 12px; resize: vertical; min-height: 80px; transition: border-color .15s; }
  .notes-area:focus { outline: none; border-color: var(--green); }

  /* PROGRESS CHART */
  .chart-wrap { position: relative; height: 140px; margin-top: 8px; }
  canvas.perf-chart { width: 100% !important; }

  /* EXERCISE SELECTOR */
  .exo-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .exo-tag-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 12px; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .exo-tag-btn:hover { color: var(--text); border-color: var(--text3); }
  .exo-tag-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  /* HISTORY LIST */
  .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--bg3); border-radius: var(--radius); margin-bottom: 6px; border: 1px solid var(--border); }
  .hi-date { font-size: 12px; color: var(--text3); }
  .hi-val { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; }
  .hi-val.pr { color: var(--green); }
  .hi-detail { font-size: 11px; color: var(--text2); }

  /* STREAK */
  .streak-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .streak-dot { width: 10px; height: 10px; border-radius: 2px; background: var(--bg4); }
  .streak-dot.done { background: var(--green); }
  .streak-dot.skip { background: var(--red); opacity: .5; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 20px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal-title { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 16px; }

  /* FORM */
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; display: block; }
  .form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px; padding: 9px 12px; transition: border-color .15s; }
  .form-input:focus { outline: none; border-color: var(--green); }
  select.form-input { cursor: pointer; }

  /* TAGS */
  .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .tag-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(57,255,20,.3); }
  .tag-amber { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,158,11,.3); }
  .tag-blue { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(59,130,246,.3); }
  .tag-red { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,.3); }

  /* DIVIDER */
  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* EMPTY */
  .empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }

  /* SCROLL */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* TOAST */
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg3); border: 1px solid var(--green); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transform: translateY(8px); transition: all .3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.pr-toast { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-brand">LIFT LOG</span>
  <button class="nav-btn active" onclick="showPage('dashboard')">Dashboard</button>
  <button class="nav-btn" onclick="showPage('session')">Séance</button>
  <button class="nav-btn" onclick="showPage('progress')">Progrès</button>
  <button class="nav-btn" onclick="showPage('history')">Historique</button>
</nav>

<!-- ═══ DASHBOARD ═══ -->
<div class="page active" id="page-dashboard">
  <div id="dash-week-header" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.05em" id="dash-week-label">Semaine 1</span>
      <span class="tag tag-green" id="dash-phase-tag">Phase 1</span>
    </div>
    <div style="font-size:12px;color:var(--text3)" id="dash-week-dates"></div>
  </div>

  <div class="week-strip" id="week-strip"></div>

  <div class="grid3" style="margin-bottom:12px" id="dash-stats"></div>

  <div class="card" id="dash-next">
    <div class="card-header">
      <span class="card-title">Prochaine séance</span>
    </div>
    <div id="dash-next-content"></div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Régularité</span>
      <span id="streak-count" class="tag tag-green"></span>
    </div>
    <div class="streak-bar" id="streak-bar"></div>
    <div style="font-size:11px;color:var(--text3);margin-top:8px">Chaque carré = 1 séance programmée</div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title">Derniers PRs</span></div>
    <div id="dash-prs"></div>
  </div>
</div>

<!-- ═══ SÉANCE ═══ -->
<div class="page" id="page-session">
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <select class="form-input" id="session-week-select" style="max-width:160px" onchange="onWeekChange()"></select>
    <select class="form-input" id="session-day-select" style="max-width:200px" onchange="loadSessionForm()"></select>
    <button class="btn btn-primary" onclick="saveSession()">Enregistrer</button>
  </div>

  <div id="session-form-area"></div>
</div>

<!-- ═══ PROGRÈS ═══ -->
<div class="page" id="page-progress">
  <div class="exo-selector" id="exo-selector"></div>
  <div id="progress-content"></div>
</div>

<!-- ═══ HISTORIQUE ═══ -->
<div class="page" id="page-history">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <span style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.05em">Toutes les séances</span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" onclick="exportCSV()">Export CSV</button>
      <button class="btn btn-sm btn-danger" onclick="if(confirm('Effacer tout ?')){clearAll()}">Reset</button>
    </div>
  </div>
  <div id="history-list"></div>
</div>

<!-- MODAL DETAIL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ═══════════════════════════════════════════════
// DATA — PROGRAMME 12 SEMAINES
// ═══════════════════════════════════════════════
const PROGRAM = {
  phases: [
    { id:1, name:'Phase 1', label:'Fondations', weeks:[1,2,3,4], color:'#22c55e' },
    { id:2, name:'Phase 2', label:'Développement', weeks:[5,6,7,8], color:'#f59e0b' },
    { id:3, name:'Phase 3', label:'Affûtage', weeks:[9,10,11,12], color:'#ef4444' }
  ],
  startDate: '2025-06-02',
  weeks: {}
};

// Helper to build week data
function wd(lun,mer,ven,sam,dim){ return {lun,mer,ven,sam,dim}; }
function course(label,detail){ return {type:'course',label,detail}; }
function circuit(exos){ return {type:'circuit',label:'Cardio-circuit',exos}; }
function force(label,exos){ return {type:'force',label,exos}; }
function repos(){ return {type:'repos',label:'Repos'}; }

const BASE_FORCE_EXOS = {
  haut: (dc,mil,trac_sets,trac_reps,trac_lest,buch,dh_dur,fc_kg) => [
    {name:'Développé couché barre', sets:dc.s, reps:dc.r, weight:dc.w, note:'Éch. 40kg × 8, 60kg × 5. Descente 3s.'},
    {name:'Dvp militaire barre', sets:mil.s, reps:mil.r, weight:mil.w, note:'Gainage abdominal pendant tout le mouvement.'},
    {name:'Tractions anneaux', sets:trac_sets, reps:trac_reps, weight:trac_lest, note:'Amplitude complète. Tempo 2-0-2.'},
    {name:'Tirage bucheron haltère', sets:3, reps:8, weight:buch, note:'Superset possible avec face pull.'},
    {name:'Face pull câble', sets:3, reps:15, weight:null, note:'Santé épaules.'},
    {name:'Dead hang barre', sets:2, reps:null, weight:null, duration:dh_dur, note:'Grip finisher.'},
    {name:'Farmer carry', sets:2, reps:null, weight:fc_kg, distance:'20m', note:'Enchaîner après dead hang.'},
  ],
  jambes: (sq,fb_w,rdl_w,sd_w,cr_w) => [
    {name:'Squat trap bar', sets:5, reps:5, weight:sq, note:'Éch. complet. Descente 3s, montée explosive.'},
    {name:'Fentes bulgares haltères', sets:4, reps:8, weight:fb_w, note:'Repos 2min. Pied arrière surélevé.'},
    {name:'Unilateral RDL', sets:3, reps:10, weight:rdl_w, note:'Focus étirement ischio. Superset step down.', perJambe:true},
    {name:'Lateral step down', sets:4, reps:10, weight:sd_w, note:'Proprioception cheville. Superset RDL.'},
    {name:'Calf raise + plyo', sets:3, reps:12, weight:cr_w, note:'Amplitude complète puis sauts plio.'},
  ]
};

// Build weeks programmatically
for(let w=1; w<=12; w++){
  let sq,fb,rdl,sd,cr,dc,mil,tr_s,tr_r,tr_l,buch,dh,fc;
  // Squat trap bar progression
  sq = w<=1?87.5: w<=2?90: w<=3?92.5: w<=4?82.5: w<=5?95: w<=6?97.5: w<=7?100: w<=8?85: w<=9?102.5: w<=10?105: w<=11?107.5: 110;
  // Fentes bulgares (per hand)
  fb = w<=1?18: w<=2?18: w<=3?20: w<=4?17: w<=5?22: w<=6?23: w<=7?24: w<=8?20: w<=9?25: w<=10?26: w<=11?27: 28;
  // RDL unilateral
  rdl = w<=1?12.5: w<=2?13.75: w<=3?15: w<=4?12: w<=5?16: w<=6?16.5: w<=7?17: w<=8?14: w<=9?18: w<=10?19: w<=11?20: 20;
  // Step down
  sd = w<=1?20: w<=2?20: w<=3?22.5: w<=4?18: w<=5?22.5: w<=6?23: w<=7?23.5: w<=8?20: w<=9?25: w<=10?26: w<=11?27: 27;
  // Calf raise
  cr = w<=1?10: w<=2?12.5: w<=3?15: w<=4?10: w<=5?17.5: w<=6?18.75: w<=7?20: w<=8?15: w<=9?22.5: w<=10?25: w<=11?27.5: 27.5;
  // DC barre
  dc = w<=1?{s:3,r:7,w:72.5}: w<=2?{s:3,r:7,w:72.5}: w<=3?{s:3,r:7,w:75}: w<=4?{s:3,r:5,w:65}: w<=5?{s:4,r:7,w:77.5}: w<=6?{s:4,r:7,w:77.5}: w<=7?{s:4,r:7,w:80}: w<=8?{s:3,r:5,w:68}: w<=9?{s:4,r:7,w:82.5}: w<=10?{s:4,r:7,w:85}: w<=11?{s:4,r:6,w:87.5}: {s:3,r:6,w:90};
  // Militaire
  mil = w<=1?{s:4,r:10,w:32.5}: w<=2?{s:4,r:10,w:33.75}: w<=3?{s:4,r:10,w:35}: w<=4?{s:3,r:8,w:30}: w<=5?{s:4,r:10,w:37.5}: w<=6?{s:4,r:10,w:38.75}: w<=7?{s:4,r:10,w:40}: w<=8?{s:3,r:8,w:34}: w<=9?{s:4,r:10,w:42.5}: w<=10?{s:4,r:10,w:45}: w<=11?{s:4,r:8,w:47.5}: {s:3,r:8,w:50};
  // Tractions
  tr_s=5; tr_l=null;
  if(w<=1){tr_r=6;}
  else if(w<=2){tr_r=7;}
  else if(w<=3){tr_r=8;}
  else if(w<=4){tr_r=6;}
  else if(w<=5){tr_r=6;tr_l=5;}
  else if(w<=6){tr_r=7;tr_l=5;}
  else if(w<=7){tr_r=8;tr_l=5;}
  else if(w<=8){tr_r=6;tr_l=null;}
  else if(w<=9){tr_r=8;tr_l=7.5;}
  else if(w<=10){tr_r=8;tr_l=10;}
  else if(w<=11){tr_r=6;tr_l=12.5;}
  else{tr_r=6;tr_l=12.5;}
  // Bucheron

// HELPERS
// ═══════════════════════════════════════════════
function getPhaseForWeek(w){
  return PROGRAM.phases.find(p=>p.weeks.includes(w)) || PROGRAM.phases[0];
}
function getWeekDates(weekNum){
  const start = new Date(PROGRAM.startDate);
  start.setDate(start.getDate() + (weekNum-1)*7);
  const end = new Date(start); end.setDate(end.getDate()+4);
  const fmt = d => d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  return { start, end, label: `${fmt(start)} → ${fmt(end)}` };
}
function getCurrentWeek(){
  const now = new Date();
  const start = new Date(PROGRAM.startDate);
  const diff = Math.floor((now-start)/(7*24*3600*1000));
  return Math.max(1, Math.min(12, diff+1));
}
function logKey(week, day){ return `w${week}_${day}`; }
function getLog(week, day){ return state.logs[logKey(week,day)] || null; }
function isToday(weekNum, dayKey){
  const days = ['lun','mar','mer','jeu','ven','sam','dim'];
  const dayIndex = days.indexOf(dayKey);
  const weekStart = new Date(PROGRAM.startDate);
  weekStart.setDate(weekStart.getDate() + (weekNum-1)*7 + dayIndex);
  const now = new Date();
  return weekStart.toDateString() === now.toDateString();
}
function fmtWeight(w){ return w !== null && w !== undefined ? w + ' kg' : 'PC'; }
function computeMax(sets){ // 1RM estimate or max weight used
  if(!sets || !sets.length) return 0;
  return Math.max(...sets.map(s=>parseFloat(s.w)||0));
}

// ═══════════════════════════════════════════════
// PR DETECTION
// ═══════════════════════════════════════════════
function getAllLogsForExo(exoName){
  const results = [];
  Object.entries(state.logs).forEach(([key,log])=>{
    if(!log || !log.exos) return;
    log.exos.forEach(exo=>{
      if(exo.name===exoName && exo.sets && exo.sets.length){
        const maxW = computeMax(exo.sets);
        if(maxW>0) results.push({key, date:log.date||key, maxW, sets:exo.sets, volume:exo.sets.reduce((a,s)=>(parseFloat(s.w)||0)*(parseInt(s.r)||0)+a,0)});
      }
    });
  });
  results.sort((a,b)=>a.date.localeCompare(b.date));
  return results;
}
function isPR(exoName, currentKey){
  const all = getAllLogsForExo(exoName);
  const idx = all.findIndex(l=>l.key===currentKey);
  if(idx<=0) return false;
  const prev = all.slice(0,idx);
  const currentMax = all[idx].maxW;
  return currentMax > Math.max(...prev.map(l=>l.maxW));
}

function renderDashboard(){
  const w = getCurrentWeek();
  const phase = getPhaseForWeek(w);
  const dates = getWeekDates(w);
  document.getElementById('dash-week-label').textContent = `Semaine ${w}${PROGRAM.weeks[w]?.isDecharge?' · Décharge':''}`;
  document.getElementById('dash-phase-tag').textContent = `${phase.name} — ${phase.label}`;
  document.getElementById('dash-week-dates').textContent = dates.label;

  // Week strip
  const strip = document.getElementById('week-strip');
  const activeDays = ['lun','mer','ven','sam','dim'];
  const dayLabels = {lun:'Lun',mer:'Mer',ven:'Ven',sam:'Sam',dim:'Dim'};
  const dayTypes = {lun:'Course',mer:'Circuit',ven:'Course',sam:'Haut',dim:'Jambes'};
  strip.innerHTML = activeDays.map(day=>{
    const log = getLog(w, day);
    const today = isToday(w, day);
    let cls = 'day-pill'; let status = '○';
    if(log?.done){ cls+=' done'; status='✓'; }
    else if(today){ cls+=' today'; status='►'; }
    return `<div class="${cls}" onclick="quickNavSession(${w},'${day}')">
      <div class="day-pill-name">${dayLabels[day]}</div>
      <div class="day-pill-type">${dayTypes[day]}</div>
      <div class="day-pill-status">${status}</div>
    </div>`;
  }).join('');

  // Stats
  const totalDone = Object.values(state.logs).filter(l=>l?.done).length;
  const totalPlanned = w * 5;
  const pct = totalPlanned ? Math.round(totalDone/totalPlanned*100) : 0;
  const weekDone = activeDays.filter(d=>getLog(w,d)?.done).length;
  document.getElementById('dash-stats').innerHTML = `
    <div class="stat green"><div class="stat-label">Séances</div><div class="stat-value">${totalDone}</div><div class="stat-sub">au total</div></div>
    <div class="stat"><div class="stat-label">Semaine ${w}</div><div class="stat-value">${weekDone}/5</div><div class="stat-sub">séances faites</div></div>
    <div class="stat"><div class="stat-label">Complétion</div><div class="stat-value">${pct}%</div><div class="stat-sub">du plan</div></div>
  `;

  // Next session
  const nextDay = activeDays.find(d=>!getLog(w,d)?.done);
  const nextContent = document.getElementById('dash-next-content');
  if(nextDay){
    const dayData = PROGRAM.weeks[w]?.days[nextDay];
    nextContent.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;text-transform:uppercase">${dayLabels[nextDay]} — ${dayData?.label||''}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">${PROGRAM.weeks[w]?.isDecharge?'Semaine de décharge':phase.label}</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="quickNavSession(${w},'${nextDay}')">Démarrer →</button>
      </div>`;
  } else {
    nextContent.innerHTML = '<div style="color:var(--green);font-weight:600;font-size:14px">✓ Semaine complète !</div>';
  }

  // Streak
  const streakBar = document.getElementById('streak-bar');
  let streak=0, maxStreak=0, cur=0;
  const allKeys = [];
  for(let ww=1;ww<=12;ww++) activeDays.forEach(d=>allKeys.push({w:ww,d}));
  const dots = allKeys.map(({w:ww,d})=>{
    const log = getLog(ww,d);
    if(log?.done){ cur++; maxStreak=Math.max(maxStreak,cur); return '<div class="streak-dot done"></div>'; }
    else if(log?.skipped){ cur=0; return '<div class="streak-dot skip"></div>'; }
    else { cur=0; return '<div class="streak-dot"></div>'; }
  });
  const doneArr = allKeys.map(({w:ww,d})=>!!getLog(ww,d)?.done);
  let s=0; for(let i=doneArr.length-1;i>=0;i--){ if(doneArr[i]) s++; else break; }
  streak=s;
  streakBar.innerHTML = dots.join('');
  document.getElementById('streak-count').textContent = `${streak} de suite`;

  // PRs
  const prDiv = document.getElementById('dash-prs');
  const prExos = ['Squat trap bar','Développé couché barre','Dvp militaire barre','Tractions anneaux','Fentes bulgares haltères'];
  const prItems = prExos.map(name=>{
    const logs = getAllLogsForExo(name);
    if(!logs.length) return null;
    const last = logs[logs.length-1];
    return {name, max:last.maxW, date:last.date};
  }).filter(Boolean);
  if(prItems.length){
    prDiv.innerHTML = prItems.map(p=>`
      <div class="history-item">
        <div><div style="font-size:13px;font-weight:500">${p.name}</div><div class="hi-date">${p.date}</div></div>
        <div class="hi-val pr">${p.max} kg</div>
      </div>`).join('');
  } else {
    prDiv.innerHTML = '<div class="empty">Aucun PR enregistré — commence ta première séance !</div>';
  }
}

function getAnkleDesc(v){
  const d={1:'Douleur vive',2:'Gêne marquée',3:'Légère gêne',4:'Quasi normal',5:'Aucune douleur'};
  return v?d[v]:'';
}
function selectAnkle(n){
  [1,2,3,4,5].forEach(i=>{
    const btn=document.getElementById(`ankle-${i}`);
    if(btn) btn.classList.toggle('selected',i===n);
  });
  const desc=document.getElementById('ankle-desc');
  if(desc) desc.textContent=getAnkleDesc(n);
  window._selectedAnkle=n;
}

function checkPR(ei){
  const w = state.currentWeek;
  const day = document.getElementById('session-day-select').value;
  const dayData = PROGRAM.weeks[w]?.days[day];
  const exo = dayData?.exos?.[ei];
  if(!exo) return;
  const tbody = document.getElementById(`sets-tbody-${ei}`);
  if(!tbody) return;
  const sets = [];
  Array.from(tbody.children).forEach((tr,si)=>{
    const wInput=document.getElementById(`w_${ei}_${si}`);
    const rInput=document.getElementById(`r_${ei}_${si}`);
    if(wInput && rInput) sets.push({w:wInput.value,r:rInput.value});
  });
  const currentMax = computeMax(sets);
  const prevLogs = getAllLogsForExo(exo.name);
  const prevMax = prevLogs.length ? Math.max(...prevLogs.map(l=>l.maxW)) : 0;
  const prBadge = document.getElementById(`pr_${ei}`);
  if(prBadge) prBadge.style.display = (currentMax>0 && currentMax>prevMax) ? 'inline-flex':'none';
}

function collectSessionData(){
  const w = state.currentWeek;
  const day = document.getElementById('session-day-select').value;
  const dayData = PROGRAM.weeks[w]?.days[day];
  const notes = document.getElementById('session-notes')?.value || '';
  const data = { notes, done:true, date:new Date().toLocaleDateString('fr-FR'), exos:[] };

  if(dayData?.type==='force'){
    dayData.exos.forEach((exo,ei)=>{
      const tbody = document.getElementById(`sets-tbody-${ei}`);
      if(!tbody) return;
      const sets=[];
      Array.from(tbody.children).forEach((tr,si)=>{
        const wv=document.getElementById(`w_${ei}_${si}`)?.value;
        const rv=document.getElementById(`r_${ei}_${si}`)?.value;
        if(wv||rv) sets.push({w:wv||'',r:rv||''});
      });
      data.exos.push({name:exo.name, sets});
    });
  }
  if(dayData?.type==='course'){
    data.ankle = window._selectedAnkle || null;
  }
  return {w, day, data};
}

function saveSession(){
  const {w,day,data} = collectSessionData();
  const key = logKey(w,day);
  // Check PRs before saving
  const newPRs = [];
  if(data.exos){
    data.exos.forEach(exo=>{
      const prevLogs = getAllLogsForExo(exo.name);
      const prevMax = prevLogs.length ? Math.max(...prevLogs.map(l=>l.maxW)) : 0;
      const currentMax = computeMax(exo.sets);
      if(currentMax>0 && currentMax>prevMax) newPRs.push(exo.name);
    });
  }
  state.logs[key] = data;
  saveState();
  loadSessionForm();
  renderDashboard();
  if(newPRs.length){
    toast(`🏆 PR battu : ${newPRs.join(', ')}!`, 'pr-toast');
  } else {
    toast('Séance enregistrée ✓');
  }
}
function unmarkDone(w,day){
  const key=logKey(w,day);
  if(state.logs[key]) state.logs[key].done=false;
  saveState();
  loadSessionForm();
  renderDashboard();
}
function quickNavSession(w,day){
  state.currentWeek=w;
  showPage('session');
  populateSessionSelects();
  populateDaySelect();
  document.getElementById('session-day-select').value=day;
  loadSessionForm();
}

// ═══════════════════════════════════════════════
// RENDER PROGRESS
// ═══════════════════════════════════════════════
const TRACKED_EXOS = ['Squat trap bar','Développé couché barre','Dvp militaire barre','Tractions anneaux','Fentes bulgares haltères','Tirage bucheron haltère','Unilateral RDL','Lateral step down'];

let progressChart = null;

function renderProgress(){
  const sel = document.getElementById('exo-selector');
  sel.innerHTML = TRACKED_EXOS.map(name=>`
    <button class="exo-tag-btn ${state.selectedExo===name?'active':''}" onclick="selectExo('${name}')">${name}</button>
  `).join('');
  renderProgressChart();
}
function selectExo(name){
  state.selectedExo=name;
  renderProgress();
}
function renderProgressChart(){
  const content=document.getElementById('progress-content');
  const name=state.selectedExo||TRACKED_EXOS[0];
  const logs=getAllLogsForExo(name);

  // Planned progression
  const planned=[];
  for(let w=1;w<=12;w++){
    const week=PROGRAM.weeks[w];
    if(!week) continue;
    ['sam','dim'].forEach(day=>{
      const dayData=week.days[day];
      if(dayData?.type!=='force') return;
      const exo=dayData.exos?.find(e=>e.name===name);
      if(!exo) return;
      const pw = typeof exo.weight==='number'?exo.weight: parseFloat((exo.weight||'').replace(/[^\d.]/g,''))||0;
      planned.push({w,label:`S${w}`,weight:pw});
    });
  }

  const labels=planned.map(p=>p.label);
  const plannedData=planned.map(p=>p.weight);
  const actualData=planned.map(p=>{
    const match=logs.find(l=>l.key.includes(`w${p.w}_`));
    return match?match.maxW:null;
  });
  const prPoints=actualData.map((v,i)=>{
    if(!v) return null;
    const prev=actualData.slice(0,i).filter(Boolean);
    return (prev.length && v>Math.max(...prev))?v:null;
  });

  const latestActual=actualData.filter(Boolean);
  const currentMax=latestActual.length?Math.max(...latestActual):0;
  const startMax=plannedData[0]||0;
  const endMax=plannedData[plannedData.length-1]||0;
  const gain=currentMax-startMax;

  content.innerHTML = `
    <div class="card">
      <div class="card-header">
        <span class="card-title" style="font-size:18px">${name}</span>
        ${currentMax>0?`<span class="tag tag-green">Max : ${currentMax} kg</span>`:''}
      </div>
      <div class="grid3" style="margin-bottom:16px">
        <div class="stat"><div class="stat-label">Départ plan</div><div class="stat-value">${startMax}</div><div class="stat-sub">kg prévu</div></div>
        <div class="stat ${currentMax>0?'green':''}"><div class="stat-label">Max actuel</div><div class="stat-value">${currentMax||'—'}</div><div class="stat-sub">kg réel</div></div>
        <div class="stat"><div class="stat-label">Objectif fin</div><div class="stat-value">${endMax}</div><div class="stat-sub">kg prévu</div></div>
      </div>
      <div class="chart-wrap">
        <canvas id="main-chart"></canvas>
      </div>
      <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)"><div style="width:20px;height:2px;background:var(--border2);border-style:dashed"></div>Programme</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)"><div style="width:20px;height:2px;background:var(--green)"></div>Réalisé</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)"><div style="width:10px;height:10px;border-radius:50%;background:var(--green)"></div>PR</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Historique des séances</span></div>
      ${logs.length?logs.slice().reverse().map((l,i)=>{
        const isPrEntry=i<logs.length-1&&l.maxW>Math.max(...logs.slice(0,logs.length-1-i).map(x=>x.maxW));
        return `<div class="history-item">
          <div><div class="hi-date">${l.date}</div><div class="hi-detail">${l.sets.length} série${l.sets.length>1?'s':''} · max ${l.maxW} kg</div></div>
          <div class="hi-val ${isPrEntry?'pr':''}">${l.maxW} kg${isPrEntry?' ★':''}</div>
        </div>`;
      }).join(''):'<div class="empty">Aucune donnée enregistrée pour cet exercice.</div>'}
    </div>`;

  setTimeout(()=>{
    const ctx=document.getElementById('main-chart');
    if(!ctx) return;
    if(progressChart) progressChart.destroy();
    progressChart=new Chart(ctx,{
      type:'line',
      data:{
        labels,
        datasets:[
          {label:'Programme',data:plannedData,borderColor:'#333',borderDash:[4,4],borderWidth:1.5,pointRadius:0,fill:false,tension:0.3},
          {label:'Réalisé',data:actualData,borderColor:'#39ff14',borderWidth:2,pointRadius:actualData.map((v,i)=>prPoints[i]?6:v?3:0),pointBackgroundColor:actualData.map((v,i)=>prPoints[i]?'#39ff14':'#39ff14'),fill:true,backgroundColor:'rgba(57,255,20,0.06)',tension:0.3,spanGaps:true},
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1a1a',borderColor:'#333',borderWidth:1,titleColor:'#f0f0f0',bodyColor:'#888',callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y||'—'} kg`}}},
        scales:{
          x:{grid:{color:'#1a1a1a'},ticks:{color:'#555',font:{size:10}}},
          y:{grid:{color:'#1a1a1a'},ticks:{color:'#555',font:{size:10},callback:v=>`${v}kg`}}
        }
      }
    });
  },100);
}

// ═══════════════════════════════════════════════
// RENDER HISTORY
// ═══════════════════════════════════════════════
function renderHistory(){
  const list=document.getElementById('history-list');
  const entries=Object.entries(state.logs).filter(([,v])=>v?.done).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!entries.length){ list.innerHTML='<div class="empty">Aucune séance enregistrée.</div>'; return; }
  list.innerHTML=entries.map(([key,log])=>{
    const [,wStr,day]=key.match(/w(\d+)_(\w+)/)||[];
    const w=parseInt(wStr);
    const dayLabels={lun:'Lundi',mer:'Mercredi',ven:'Vendredi',sam:'Samedi',dim:'Dimanche'};
    const dayTypes={lun:'Course',mer:'Circuit',ven:'Course',sam:'Haut lourd',dim:'Jambes'};
    const phase=getPhaseForWeek(w);
    return `<div class="card" style="cursor:pointer" onclick="openLogDetail('${key}')">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase">${dayLabels[day]||day} — ${dayTypes[day]||''}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${phase.name} · S${w} · ${log.date||''}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${log.ankle?`<span class="tag tag-${log.ankle>=4?'green':log.ankle>=3?'amber':'red'}">Cheville ${log.ankle}/5</span>`:''}
          <span class="tag tag-green">✓</span>
        </div>
      </div>
      ${log.notes?`<div style="font-size:12px;color:var(--text3);margin-top:8px;line-height:1.5">${log.notes}</div>`:''}
    </div>`;
  }).join('');
}

function openLogDetail(key){
  const log=state.logs[key];
  if(!log) return;
  const [,wStr,day]=key.match(/w(\d+)_(\w+)/)||[];
  const w=parseInt(wStr);
  const dayLabels={lun:'Lundi',mer:'Mercredi',ven:'Vendredi',sam:'Samedi',dim:'Dimanche'};
  let html=`<div class="modal-title">${dayLabels[day]||day} — S${w}</div>`;
  if(log.exos?.length){
    log.exos.forEach(exo=>{
      if(!exo.sets?.length) return;
      html+=`<div style="margin-bottom:14px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;margin-bottom:6px;color:var(--text2)">${exo.name}</div>
        ${exo.sets.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px"><span>Série ${i+1}</span><span>${s.w||'—'} kg × ${s.r||'—'} reps</span></div>`).join('')}
      </div>`;
    });
  }
  if(log.ankle) html+=`<div style="margin-bottom:12px"><span class="tag tag-${log.ankle>=4?'green':log.ankle>=3?'amber':'red'}">Cheville : ${log.ankle}/5 — ${getAnkleDesc(log.ankle)}</span></div>`;
  if(log.notes) html+=`<div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px">${log.notes}</div>`;
  html+=`<button class="btn" onclick="closeModal()">Fermer</button>`;
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e){ if(!e||e.target===document.getElementById('modal-overlay')) document.getElementById('modal-overlay').classList.remove('open'); }

// ═══════════════════════════════════════════════
// EXPORT CSV
// ═══════════════════════════════════════════════
function exportCSV(){
  const rows=[['Semaine','Jour','Date','Exercice','Série','Poids(kg)','Reps','Notes','Cheville']];
  Object.entries(state.logs).forEach(([key,log])=>{
    if(!log?.done) return;
    const [,wStr,day]=key.match(/w(\d+)_(\w+)/)||[];
    if(log.exos?.length){
      log.exos.forEach(exo=>{
        (exo.sets||[]).forEach((s,si)=>{
          rows.push([wStr,day,log.date||'',exo.name,si+1,s.w||'',s.r||'',si===0?(log.notes||''):'','']);
        });
      });
    } else {
      rows.push([wStr,day,log.date||'','Course','','','',log.notes||'',log.ankle||'']);
    }
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='liftlog_export.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('Export CSV téléchargé');
}

// ═══════════════════════════════════════════════
// NAVIGATION & INIT
// ═══════════════════════════════════════════════
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`page-${id}`).classList.add('active');
  event?.target?.classList.add('active');
  const pages=['dashboard','session','progress','history'];
  const btns=document.querySelectorAll('.nav-btn');
  btns[pages.indexOf(id)]?.classList.add('active');
  if(id==='dashboard') renderDashboard();
  if(id==='session') loadSessionForm();
  if(id==='progress') renderProgress();
  if(id==='history') renderHistory();
}

function toast(msg, cls=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast ${cls} show`;
  setTimeout(()=>t.classList.remove('show'),3000);
}

function renderAll(){
  renderDashboard();
  renderHistory();
  if(document.getElementById('page-progress').classList.contains('active')) renderProgress();
}

// INIT
loadState();
state.currentWeek = getCurrentWeek();
state.selectedExo = TRACKED_EXOS[0];
populateSessionSelects();
populateDaySelect();
renderDashboard();
</script>
